name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Linux
    strategy:
      fail-fast: true

      # PS versions in support: https://learn.microsoft.com/en-us/powershell/scripting/install/powershell-support-lifecycle
      # .NET SDK Docker images: https://mcr.microsoft.com/v2/dotnet/sdk/tags/list
      # PS ships inside the .NET SDK image for its corresponding .NET version
      matrix:
        include:
          # begin-powershell-versions
          # PS 7.7 Preview — .NET 11.0
          - version: 11.0-preview
            networkVersion: "7.19.0"
          # PS 7.6 LTS — .NET 10.0
          - version: 10.0-noble
            networkVersion: "7.19.0"
          # PS 7.5 Stable — .NET 9.0
          - version: 9.0-noble
            networkVersion: "7.19.0"
          # PS 7.4 LTS — .NET 8.0
          - version: 8.0-jammy
            networkVersion: "5.2.0"
          - version: 8.0-noble
            networkVersion: "7.19.0"
          # end-powershell-versions

    runs-on: ubuntu-22.04
    container: mcr.microsoft.com/dotnet/sdk:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester Module
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Repository PSGallery -Force
          Install-Module -Name Az.Network -requiredVersion ${{ matrix.networkVersion }} -Scope CurrentUser -Repository PSGallery -Force -Verbose

          Get-InstalledModule
        shell: pwsh -Command "$ProgressPreference = 'SilentlyContinue'; & '{0}'"

      - name: Run Pester Tests
        run: |
          Import-Module Pester

          $cfg = [PesterConfiguration]::Default
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.UseBreakpoints = $true
          $cfg.Run.Exit = $true

          Invoke-Pester -Configuration $cfg
        shell: pwsh -Command "$ProgressPreference = 'SilentlyContinue'; & '{0}'"

  test-windows:
    name: Test Windows
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Remove old Pester
        run: |
          # https://pester.dev/docs/introduction/installation#removing-the-built-in-version-of-pester
          $module = "C:\Program Files\WindowsPowerShell\Modules\Pester"
          takeown /F $module /A /R
          icacls $module /reset
          icacls $module /grant "*S-1-5-32-544:F" /inheritance:d /T
          Remove-Item -Path $module -Recurse -Force -Confirm:$false
        shell: powershell

      - name: PowerShell Module Cache
        uses: potatoqualitee/psmodulecache@v6.3
        with:
          modules-to-cache: Pester:6.1.0, Az.Network, Az.Accounts
          shell: powershell

      - name: Run Pester Tests
        run: |
          Get-InstalledModule

          Import-Module Pester

          $cfg = [PesterConfiguration]::Default
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.UseBreakpoints = $true
          $cfg.Run.Exit = $true

          Invoke-Pester -Configuration $cfg
        shell: powershell

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - test
      - test-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nerdbank.GitVersioning
        uses: dotnet/nbgv@v0.5.2
        id: nbgv

      - uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          makeLatest: true
          commit: main
          tag: v${{ steps.nbgv.outputs.SimpleVersion }}
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
