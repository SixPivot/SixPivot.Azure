name: Update PowerShell Versions

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-versions:
    name: Check PowerShell Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and update PowerShell versions
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # ── 1. Fetch the PowerShell support-lifecycle markdown ──────────────
          $lifecycleUrl = 'https://raw.githubusercontent.com/MicrosoftDocs/PowerShell-Docs/refs/heads/main/reference/docs-conceptual/install/PowerShell-Support-Lifecycle.md'
          $markdown = (Invoke-WebRequest -Uri $lifecycleUrl -UseBasicParsing).Content

          # Parse version table rows, e.g.:
          #   | PowerShell 7.6 (LTS)     | 18-Mar-2026 | 14-Nov-2028 | ...
          #   | PowerShell 7.7 (preview) | ...
          $today = [datetime]::UtcNow

          $supportedVersions = [System.Collections.Generic.List[hashtable]]::new()
          $previewVersions   = [System.Collections.Generic.List[string]]::new()

          $tableRows = ($markdown -split "`n") | Select-String -Pattern '^\|\s*PowerShell\s+([\d.]+)\s*(\([^)]*\))?\s*\|[^|]+\|([^|]+)\|'
          foreach ($row in $tableRows) {
            $m = [regex]::Match($row.Line, '^\|\s*PowerShell\s+([\d.]+)\s*(\([^)]*\))?\s*\|[^|]+\|([^|]+)\|')
            if (-not $m.Success) { continue }
            $versionStr = $m.Groups[1].Value.Trim()
            $qualifier  = $m.Groups[2].Value.Trim().ToLower()
            $eolRaw     = $m.Groups[3].Value.Trim()

            if ($qualifier -like '*(preview)*') {
              $previewVersions.Add($versionStr)
              continue
            }

            # Skip if no end-of-support date (may be future release with no EOL set yet)
            if ([string]::IsNullOrWhiteSpace($eolRaw)) { continue }
            try {
              $eolDate = [datetime]::ParseExact($eolRaw, 'dd-MMM-yyyy',
                [System.Globalization.CultureInfo]::InvariantCulture)
              if ($eolDate -gt $today) {
                $supportedVersions.Add(@{ Version = $versionStr; EOL = $eolDate })
              } else {
                Write-Host "::warning::PowerShell $versionStr reached end-of-support on $($eolDate.ToString('dd-MMM-yyyy'))"
              }
            } catch { continue }
          }

          Write-Host "Supported stable versions: $(($supportedVersions | ForEach-Object { $_.Version }) -join ', ')"
          Write-Host "Preview versions:          $($previewVersions -join ', ')"

          # ── 2. Fetch available image tags from MCR ────────────────────────
          $mcrUrl  = 'https://mcr.microsoft.com/v2/powershell/tags/list'
          $mcrJson = (Invoke-WebRequest -Uri $mcrUrl -UseBasicParsing).Content | ConvertFrom-Json
          $allTags = $mcrJson.tags

          # Ubuntu tags follow the pattern: [preview-]<major.minor>-ubuntu-<XX.YY>
          $ubuntuTags = $allTags | Where-Object { $_ -match '^(preview-)?[\d.]+-ubuntu-[\d.]+$' }

          # ── 3. Build expected matrix entries ─────────────────────────────
          # For each supported stable version pick available ubuntu tags.
          # If no stable tag exists yet on MCR, fall back to the preview tag.
          $ubuntuDistros = @('ubuntu-20.04', 'ubuntu-22.04', 'ubuntu-24.04')

          $expectedMatrix = [System.Collections.Generic.List[string]]::new()

          foreach ($entry in $supportedVersions) {
            $v = $entry.Version
            foreach ($distro in $ubuntuDistros) {
              $stableTag  = "$v-$distro"
              $previewTag = "preview-$v-$distro"
              if ($ubuntuTags -contains $stableTag) {
                $expectedMatrix.Add($stableTag)
              } elseif ($ubuntuTags -contains $previewTag) {
                Write-Host "Note: stable '$stableTag' not on MCR yet, using '$previewTag'"
                $expectedMatrix.Add($previewTag)
              } else {
                Write-Host "::warning::No MCR tag for PowerShell $v on $distro — skipping"
              }
            }
          }

          # Preview versions: only include if a preview-X.Y-ubuntu-* tag exists on MCR
          foreach ($pv in $previewVersions) {
            foreach ($distro in $ubuntuDistros) {
              $tag = "preview-$pv-$distro"
              if ($ubuntuTags -contains $tag) {
                $expectedMatrix.Add($tag)
              }
            }
          }

          $expectedMatrix = @($expectedMatrix | Select-Object -Unique)
          Write-Host "Expected matrix tags ($($expectedMatrix.Count)):"
          $expectedMatrix | ForEach-Object { Write-Host "  $_" }

          # ── 4. Read current ci.yml ────────────────────────────────────────
          $ciYmlPath = '.github/workflows/ci.yml'
          $ciLines   = Get-Content $ciYmlPath

          # Extract current version tags between sentinel comments
          $startSentinel = '# begin-powershell-versions'
          $endSentinel   = '# end-powershell-versions'

          $startIdx = ($ciLines | Select-String -SimpleMatch $startSentinel).LineNumber - 1
          $endIdx   = ($ciLines | Select-String -SimpleMatch $endSentinel).LineNumber - 1

          if ($startIdx -lt 0 -or $endIdx -lt 0) {
            Write-Error "Sentinel comments '$startSentinel' / '$endSentinel' not found in ci.yml"
            exit 1
          }

          # Parse existing tags from the matrix block
          $matrixBlock = $ciLines[($startIdx + 1)..($endIdx - 1)]
          $currentTags = @($matrixBlock | Where-Object { $_ -match '^\s+-\s+version:\s+(\S+)' } |
                           ForEach-Object { ([regex]::Match($_, '^\s+-\s+version:\s+(\S+)')).Groups[1].Value } |
                           Select-Object -Unique | Sort-Object)

          $expectedSorted = @($expectedMatrix | Sort-Object)

          Write-Host "Current tags:  $($currentTags -join ', ')"

          $missing = @($expectedSorted | Where-Object { $_ -notin $currentTags })
          $extra   = @($currentTags    | Where-Object { $_ -notin $expectedSorted })

          if ($missing.Count -eq 0 -and $extra.Count -eq 0) {
            Write-Host "ci.yml is up to date — no changes needed."
            "needs_update=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "Tags to add:    $($missing -join ', ')"
          Write-Host "Tags to remove: $($extra   -join ', ')"

          # ── 5. Build new matrix include block ────────────────────────────
          # Group tags by PS minor version (strip 'preview-' prefix for grouping)
          $byVersion = [ordered]@{}
          # Sort by version number descending so newer versions come first
          $sortedTags = $expectedMatrix | Sort-Object {
            $t = $_ -replace '^preview-', ''
            if ($t -match '^(\d+)\.(\d+)') { [int]$Matches[1] * 1000 + [int]$Matches[2] }
          } -Descending
          foreach ($tag in $sortedTags) {
            $t = $tag -replace '^preview-', ''
            if ($t -match '^(?<v>[\d.]+)-ubuntu') {
              $v = $Matches['v']
              if (-not $byVersion.Contains($v)) { $byVersion[$v] = [System.Collections.Generic.List[string]]::new() }
              $byVersion[$v].Add($tag)
            }
          }

          # networkVersion assignment rules:
          #   - Oldest supported version, first distro → 5.2.0 (oldest SDK compatibility test)
          #   - Oldest supported version, other distros → 7.0.0
          #   - All other versions → 7.19.0
          $oldestVersion = $byVersion.Keys | Select-Object -Last 1
          $newMatrixLines = [System.Collections.Generic.List[string]]::new()

          foreach ($v in $byVersion.Keys) {
            $tags = $byVersion[$v]
            $hasStable = $tags | Where-Object { $_ -notlike 'preview-*' }
            $isLTS     = ($supportedVersions | Where-Object { $_.Version -eq $v -and ($_.EOL - $today).TotalDays -gt 365 })
            $isPreviewOnly = -not $hasStable

            $label = if ($isPreviewOnly) { "Preview $v" } else { $v }
            $newMatrixLines.Add("          # $label")

            $i = 0
            foreach ($tag in $tags) {
              if ($v -eq $oldestVersion) {
                $nv = if ($i -eq 0) { '5.2.0' } else { '7.0.0' }
              } else {
                $nv = '7.19.0'
              }
              $newMatrixLines.Add("          - version: $tag")
              $newMatrixLines.Add("            networkVersion: `"$nv`"")
              $i++
            }
          }

          # Splice new block into ci.yml (replace between sentinels, keeping them)
          $beforeBlock = $ciLines[0..($startIdx)]
          $afterBlock  = $ciLines[$endIdx..($ciLines.Count - 1)]
          $newContent  = ($beforeBlock + $newMatrixLines + $afterBlock) -join "`n"
          Set-Content -Path $ciYmlPath -Value $newContent -NoNewline

          Write-Host "ci.yml updated successfully."

          # ── 6. Write PR body ─────────────────────────────────────────────
          $prBody = @"
          ## PowerShell version matrix update

          The weekly version check found differences between the currently supported PowerShell versions and the CI matrix.

          ### Tags added
          $(if ($missing) { ($missing | ForEach-Object { "- ``$_``" }) -join "`n" } else { '_none_' })

          ### Tags removed
          $(if ($extra) { ($extra | ForEach-Object { "- ``$_``" }) -join "`n" } else { '_none_' })

          ### References
          - [PowerShell Support Lifecycle](https://learn.microsoft.com/en-us/powershell/scripting/install/powershell-support-lifecycle)
          - [MCR PowerShell tags](https://mcr.microsoft.com/v2/powershell/tags/list)
          "@
          $prBody | Out-File -FilePath 'pr_body.md' -Encoding utf8
          "needs_update=true" >> $env:GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: update PowerShell version matrix"
          branch: update/powershell-versions
          delete-branch: true
          title: "ci: update PowerShell version matrix"
          body-path: pr_body.md
          labels: dependencies
